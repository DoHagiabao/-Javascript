<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xếp loại sinh viên</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>XẾP LOẠI HỌC TẬP SINH VIÊN</h1>

        <form id="studentForm">

            <label for="studentName">Tên sinh viên:</label>
            <input type="text" id="studentName" placeholder="Nhập tên sinh viên">

            <h3>Nhập điểm các môn</h3>

            <label for="score1">Giải tích 1:</label>
            <input type="number" id="score1" min="0" max="10" step="0.01">

            <label for="score2">Đại số tuyến tính:</label>
            <input type="number" id="score2" min="0" max="10" step="0.01">

            <label for="score3">Xác suất thống kê:</label>
            <input type="number" id="score3" min="0" max="10" step="0.01">

            <label for="score4">Tin học đại cương:</label>
            <input type="number" id="score4" min="0" max="10" step="0.01">

            <label for="score5">Xây dựng ứng dụng Web:</label>
            <input type="number" id="score5" min="0" max="10" step="0.01">

            <p id="error"></p>

            <button type="submit">Tính kết quả</button>

        </form>

        <div id="result" class="result"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
